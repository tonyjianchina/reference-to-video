<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{@@THEME@@;color-scheme:light dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang SC","Hiragino Sans GB",sans-serif;line-height:1.85}main{max-width:1420px;padding:48px 64px 40px;margin:auto}a{color:var(--secondary);text-underline-offset:4px}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.top{display:flex;gap:24px;align-items:center;border-bottom:1px solid var(--line);padding:0 0 22px;flex-wrap:wrap}.top a{font-size:13px;text-decoration:none}.top strong{margin-right:auto;font-size:14px;letter-spacing:.12em;color:var(--accent)}header{padding:45px 0 35px}.kicker{font-size:12px;letter-spacing:.12em;color:var(--accent)}h1,h2,h3{font-family:"Songti SC","STSong","Georgia",serif;font-weight:600}h1{font-size:clamp(34px,5vw,74px);line-height:1.2;letter-spacing:.01em;margin:20px 0 26px;max-width:1120px}h2{font-size:32px;line-height:1.45;margin:12px 0 24px}h3{font-size:24px;line-height:1.5;margin:8px 0 20px}p{max-width:900px;margin:16px 0}.lead{font-size:19px;color:var(--muted);max-width:960px}.muted,.small{color:var(--muted)}.small{font-size:13px}.meta{display:flex;gap:12px 28px;flex-wrap:wrap;color:var(--accent);font-size:13px;border-top:1px solid var(--line);padding-top:18px;margin-top:28px}section{margin:58px 0 0;padding-top:22px;border-top:1px solid var(--line)}.screen{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:28px;align-items:start}video{width:100%;max-height:78vh;display:block;background:#000;border:1px solid var(--line)}.chapters{border-top:1px solid var(--line)}.chapters button,.chapters a{display:block;text-align:left;padding:12px 10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);text-decoration:none;font-size:14px;line-height:1.6}.chapters [aria-current="true"]{background:var(--panel);border-left:3px solid var(--accent)}.chapters time{color:var(--accent);display:inline-block;min-width:48px}.actions{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;margin:14px 0}.time{border:0;padding:0;background:transparent;color:var(--accent);text-decoration:underline;text-underline-offset:4px}.triptych{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0}.triptych figure{margin:0;min-width:0}.triptych img{display:block;width:100%;border:1px solid var(--line)}figcaption{font-size:12px;color:var(--muted);padding:8px 0}.progression{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:24px 0}.progression>div{border-top:2px solid var(--accent);padding-top:10px}.progression b{color:var(--accent);font-size:14px}.progression p{font-size:15px;margin:9px 0}.callout{border-left:3px solid var(--accent);padding:15px 22px;background:var(--panel);margin:22px 0}.callout p{margin:8px 0}.demo{margin:26px 0}.demo iframe{width:100%;border:1px solid var(--line);background:var(--panel);display:block}.demo figcaption{font-size:14px}.sources{font-size:14px;color:var(--muted);margin:20px 0}.sources a{margin-right:16px}.badge{color:var(--accent);font-size:12px;padding:3px 8px;border:1px solid var(--line);margin-right:8px}.palette{display:flex;gap:18px;flex-wrap:wrap;margin:25px 0}.swatch{display:inline-flex;gap:10px;align-items:center;font-size:13px}.swatch i{display:block;width:32px;height:32px;border:1px solid var(--line)}dl{display:grid;grid-template-columns:130px 1fr;gap:12px 18px;margin:18px 0}dt{color:var(--accent)}dd{margin:0;color:var(--muted);overflow-wrap:anywhere}ul{padding-left:22px}details{border-bottom:1px solid var(--line);padding:15px 0}summary{cursor:pointer;color:var(--accent)}.scene{padding:28px 0;border-top:1px solid var(--line)}.scene:first-child{border-top:0}.scene-title{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}.scene-title h3{margin-bottom:0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--accent)}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.entry{border-top:2px solid var(--accent);padding:24px;background:var(--panel);text-decoration:none;color:var(--fg)}.entry h2{font-size:32px}.entry p{color:var(--muted)}footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.placeholder{padding:28px;background:var(--panel);border:1px solid var(--line)}@media(max-width:1050px){main{padding:32px 28px}.screen{grid-template-columns:1fr}.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){main{padding:24px 16px}.top{gap:12px}.lead{font-size:17px}h2{font-size:27px}.progression,.entry-grid{grid-template-columns:1fr}.triptych{gap:7px}.triptych figcaption{font-size:10px}.chapters{grid-template-columns:1fr}dl{grid-template-columns:1fr;gap:4px}dd{margin-bottom:14px}}
</style></head><body><main>@@BODY@@</main>
<script>
const movie=document.querySelector('video[data-main]');
document.querySelectorAll('[data-seek]').forEach(button=>button.addEventListener('click',()=>{if(!movie)return;movie.currentTime=Number(button.dataset.seek);movie.play().catch(()=>{});movie.scrollIntoView({behavior:'smooth',block:'center'});}));
if(movie)movie.addEventListener('timeupdate',()=>{document.querySelectorAll('[data-start][data-end]').forEach(button=>{button.setAttribute('aria-current',movie.currentTime>=Number(button.dataset.start)&&movie.currentTime<Number(button.dataset.end));});});
</script></body></html>
